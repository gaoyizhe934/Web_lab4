<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <!-- Use UTF-8 to support English and Māori characters. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Set the page font and margins. */
        body { font-family: Arial, sans-serif; margin: 30px; }
        /* Collapse table borders and style the cells and table header. */
        table { border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 10px; text-align: left; }
        th { background-color: #eeeeee; }
    </style>
</head>
<body>
    <!-- Display an error message here if the request fails. -->
    <p id="message"></p>
    <!-- The table header is fixed; JavaScript adds the book data below. -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price (NZD)</th>
            </tr>
        </thead>
        <!-- Container for the book rows created by JavaScript. -->
        <tbody id="books"></tbody>
    </table>
    <script>
        // Fetch book.xml from the same folder. Open this page through an HTTP server.
        fetch('book.xml')
            .then(response => {
                // Check the HTTP response and let catch handle any failure.
                if (!response.ok) {
                    throw new Error('Fetch error: ' + response.status);
                }
                // Read the XML response as a string.
                return response.text();
            })
            .then(xmlText => {
                // Create a parser and convert the XML string into a document object.
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                // Get a collection of all book elements.
                const books = xmlDoc.getElementsByTagName('book');
                // Loop through the books and create one table row for each book.
                for (let i = 0; i < books.length; i++) {
                    const book = books[i];
                    // [0] selects the first matching element; textContent reads its text.
                    const title = book.getElementsByTagName('title')[0].textContent;
                    const author = book.getElementsByTagName('author')[0].textContent;
                    const price = book.getElementsByTagName('price')[0].textContent;
                    const row = document.createElement('tr');
                    // Read the book id attribute and fill the table cells with the book details.
                    row.innerHTML = `
                        <td>${book.getAttribute('id')}</td>
                        <td>${title}</td>
                        <td>${author}</td>
                        <td>$${price}</td>
                    `;
                    // Append the new row to the table body.
                    document.getElementById('books').appendChild(row);
                }
            })
            // Display the error on the page and log it to the browser console.
            .catch(err => {
                document.getElementById('message').textContent = err.message;
                console.error(err.message);
            });
    </script>
</body>
</html>
